- id: q-url-shortener-1
  problemId: url-shortener
  relatedConceptIds: [caching]
  level: basic
  retired: false
  type: short-explain
  prompt: "How do you generate short codes with guaranteed uniqueness at scale without a per-request coordinator call?"
  answer: "Use a counter with base62 encoding. Each app server leases a range of IDs (for example 1M at a time) from a coordinator such as ZooKeeper, etcd or a DB sequence, then encodes a local counter. Seven base62 characters give about 3.5 trillion codes. Pass the ID through a bijective scramble to stop sequential guessing."
  rubric:
    - "Chooses counter or key service over hashing"
    - "Describes leasing an ID range to avoid per-request coordination"
    - "Mentions base62 and the 7-character capacity"
    - "Mentions a scramble to prevent guessing"
  explanation: "Leasing ranges moves coordination off the hot path."
  difficulty: 3
  tags: [code-generation]
  status: proposed
  src:
    {
      kind: guide,
      guide: system-design-problems,
      heading: "1. URL Shortener (TinyURL) ★",
      quote: "7 base62 chars = 62⁷ ≈ 3.5 trillion codes",
    }
