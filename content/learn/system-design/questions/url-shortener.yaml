  type: mcq
  prompt: "You need a count of every click on every short link. Which redirect status do you return?"
  options:
    - { id: a, text: "301, because it is cacheable" }
    - { id: b, text: "302, because it lets you count every click" }
    - { id: c, text: "200 with the long URL in the body" }
  answer: [b]
  explanation: "A 301 is cached by clients and hides repeat clicks from you; a 302 costs more load but each click reaches the service."
